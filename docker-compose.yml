services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: fuel-tracker:latest
    container_name: fuel-tracker
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - fuel-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---- Optional: automatic HTTPS on your own domain with Caddy ----------------
  # 1. Point a DNS A/AAAA record (e.g. fuel.example.com) at this server and open ports 80 + 443.
  # 2. cp Caddyfile.example Caddyfile and put your domain in it.
  # 3. Uncomment this service and the caddy volumes below; remove the "ports" from "app" above
  #    if you don't want the app reachable on plain HTTP.
  # 4. docker compose up -d
  #
  # caddy:
  #   image: caddy:2
  #   container_name: fuel-caddy
  #   restart: unless-stopped
  #   depends_on: [app]
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config

volumes:
  fuel-data:
  # caddy-data:
  # caddy-config:
